# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Development Site Config (HTTP only)
# For production SSL config, see mbb.ssl.conf (used via docker-compose.prod.yml)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── Webhook (M1 Gateway) — strict rate limit ──────────────────────────────
    location /api/v1/messages/ {
        limit_req zone=webhook burst=10 nodelay;
        proxy_pass         http://mbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 65s;     # > 60s response SLA
        proxy_send_timeout 65s;
        proxy_connect_timeout 10s;
        client_max_body_size 10k;   # DRC payload constraint
    }

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass         http://mbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_connect_timeout 10s;
        client_max_body_size 10k;
    }

    # ── Health (no rate limit — used by Docker and load balancer) ─────────────
    location /health {
        proxy_pass         http://mbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Prometheus metrics (internal — block external access in prod) ──────────
    location /metrics {
        proxy_pass         http://mbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # In prod: add `allow 127.0.0.1; deny all;`
    }

    # ── Streamlit Dashboard ────────────────────────────────────────────────────
    location /dashboard/ {
        limit_req zone=dashboard burst=20 nodelay;
        proxy_pass         http://mbb_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Grafana ───────────────────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass         http://mbb_grafana/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Default ───────────────────────────────────────────────────────────────
    location / {
        return 404;
    }
}
