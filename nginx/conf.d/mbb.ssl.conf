# MBB ya Kin — Production Nginx SSL configuration
# Requires Let's Encrypt certs at /etc/letsencrypt/live/api.mbb.cd/

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.mbb.cd dashboard.mbb.cd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — API
server {
    listen 443 ssl http2;
    server_name api.mbb.cd;

    ssl_certificate     /etc/letsencrypt/live/api.mbb.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mbb.cd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Nginx-level rate limiting; zone is defined in nginx.conf.
    limit_req zone=api burst=20 nodelay;

    location / {
        proxy_pass http://mbb_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS — Dashboard
server {
    listen 443 ssl http2;
    server_name dashboard.mbb.cd;

    ssl_certificate     /etc/letsencrypt/live/api.mbb.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mbb.cd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://mbb_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
