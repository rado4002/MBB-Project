# Shared React serving rules. API and health locations take precedence.
root /usr/share/nginx/html;
index index.html;

location = /api {
    return 404;
}

location = /assets {
    return 404;
}

# Vite assets (including extensionless misses) must never become SPA HTML.
location ^~ /assets/ {
    try_files $uri =404;
}

location ~ /\. {
    return 404;
}

# Public files and missing file-like paths must never become SPA HTML.
location ~* \.[^/]+$ {
    try_files $uri =404;
}

location = /index.html {
    expires -1;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
