# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Base Configuration
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Gzip (critical for DRC 3G) ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/javascript
        text/xml
        application/xml
        application/x-www-form-urlencoded;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Webhook endpoint: strict (30 req/min per IP)
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
    # API general: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    # Dashboard: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    # Docker DNS resolves 'api' to all running api containers (round-robin)
    upstream mbb_api {
        server api:8000;
        keepalive 32;
    }

    upstream mbb_dashboard {
        server dashboard:8501;
        keepalive 8;
    }

    upstream mbb_grafana {
        server grafana:3000;
        keepalive 8;
    }

    # ── Include site configs ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
