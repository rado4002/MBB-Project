# MBB ya Kin - isolated recovery dry-run Nginx configuration.
# HTTP-only local routing for the recovery dry run.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $request_uri $safe_request_uri {
        ~^/api/v1/customers/[^/?]+/opt-out(?:\?.*)?$  "/api/v1/customers/{customer}/opt-out";
        ~^/api/v1/customers/[^/?]+/language(?:\?.*)?$ "/api/v1/customers/{customer}/language";
        ~^/api/v1/customers/[^/?]+(?:\?.*)?$          "/api/v1/customers/{customer}";
        default                                        $request_uri;
    }

    log_format recovery_combined
        '$remote_addr - $remote_user [$time_local] "$request_method $safe_request_uri $server_protocol" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log recovery_combined;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream mbb_api {
        server api:8000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/mbb.recovery-dryrun.conf;
}
