# MBB ya Kin - isolated recovery dry-run Nginx configuration.
# HTTP-only local routing for the recovery dry run.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format recovery_combined
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log recovery_combined;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream mbb_api {
        server api:8000;
        keepalive 16;
    }

    upstream mbb_dashboard {
        server dashboard:8501;
        keepalive 8;
    }

    include /etc/nginx/conf.d/mbb.recovery-dryrun.conf;
}
