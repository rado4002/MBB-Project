# ─────────────────────────────────────────────────────────────────────────────
# MBB ya Kin — Production Overrides
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs base:
#   - WhatsApp Official API (no Baileys)
#   - 3 API replicas via --scale api=3
#   - SSL via Nginx (certificates must be placed in nginx/certs/)
#   - Stricter resource limits
#   - DEBUG disabled
# ─────────────────────────────────────────────────────────────────────────────

services:

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      WHATSAPP_MODE: official
      DEBUG: "false"
      LOG_LEVEL: INFO
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
      resources:
        limits:
          memory: 512M

  celery_worker:
    environment:
      WHATSAPP_MODE: official
      DEBUG: "false"
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          memory: 512M

  celery_beat:
    environment:
      WHATSAPP_MODE: official
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 256M

  dashboard:
    environment:
      WHATSAPP_MODE: official
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/mbb.ssl.conf:/etc/nginx/conf.d/mbb.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
