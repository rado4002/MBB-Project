# ─────────────────────────────────────────────────────────────────────────────
# Redis 7 — Configuration
# DRC-critical: AOF persistence survives blackouts
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379

# ── AOF Persistence (Blackout Recovery) ──────────────────────────────────────
# AOF ensures no message is lost during a power outage.
# On recovery, Redis replays the AOF log to restore state.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec          # Flush to disk every second (balance: perf vs safety)
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# ── RDB Snapshot (additional safety net) ─────────────────────────────────────
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Memory ────────────────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru   # Evict LRU keys when memory full
maxmemory-samples 5

# ── Timeouts ──────────────────────────────────────────────────────────────────
timeout 300
tcp-keepalive 60

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Slow Log (debug queries > 10ms) ──────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Keyspace Notifications (for Celery task expiry tracking) ──────────────────
notify-keyspace-events Ex
