# ─────────────────────────────────────────────────────────────────────────────
# MBB ya Kin — CI Pipeline
# Runs on every push to main and on pull requests.
# Steps: lint → import check → unit tests → schema validation → Docker build
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ── Step 1: Lint + Import Validation ──────────────────────────────────────
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      DEBUG: "true"
      POSTGRES_HOST: localhost
      POSTGRES_DB: mbb
      POSTGRES_USER: mbb
      POSTGRES_PASSWORD: test
      REDIS_HOST: localhost
      JWT_SECRET: testsecret32charslongpadding12345
      CLAUDE_API_KEY: test
      AIRTABLE_API_KEY: test
      PAYMENT_WEBHOOK_SECRET: test
      SCHEDULED_TASKS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        run: ruff format app/ --check
        continue-on-error: true

      - name: Validate all imports (project setup)
        run: python tests/test_project_setup.py

  # ── Step 2: Unit Tests (with Redis + Postgres) ───────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-validate
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mbb
          POSTGRES_USER: mbb
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -d mbb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: development
      DEBUG: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mbb
      POSTGRES_USER: mbb
      POSTGRES_PASSWORD: test
      REDIS_HOST: localhost
      JWT_SECRET: testsecret32charslongpadding12345
      CLAUDE_API_KEY: test
      AIRTABLE_API_KEY: test
      PAYMENT_WEBHOOK_SECRET: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create mbb schema + extensions
        run: |
          PGPASSWORD=test psql -h localhost -U mbb -d mbb -c "
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS \"pg_trgm\";
            CREATE EXTENSION IF NOT EXISTS \"unaccent\";
            CREATE SCHEMA IF NOT EXISTS mbb;
            ALTER DATABASE mbb SET search_path TO mbb, public;
          "

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Schema & API validation (12 checks)
        run: python tests/test_schema_api_validation.py

      - name: Resilience unit tests (7 checks)
        run: python tests/test_resilience.py

  # ── Step 3: Docker Build Verification ────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder secrets
        run: |
          mkdir -p secrets
          for f in postgres_db postgres_user postgres_password jwt_secret \
                   claude_api_key airtable_api_key whatsapp_api_token \
                   orange_money_key airtel_money_key mpesa_key \
                   payment_webhook_secret grafana_admin_password redis_password; do
            echo "placeholder" > "secrets/${f}.txt"
          done
          echo "mbb" > secrets/postgres_db.txt
          echo "mbb" > secrets/postgres_user.txt
          echo "testpassword" > secrets/postgres_password.txt

      - name: Build backend image
        run: docker build -t mbb-api:ci ./backend

      - name: Build baileys image
        run: docker build -t mbb-baileys:ci ./baileys

      - name: Build dashboard image
        run: docker build -t mbb-dashboard:ci ./dashboard

      - name: Verify Docker Compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
